# Réglages de Gagarine, le garde-RAM du poste. Fichier lu au démarrage du service :
# après une modification, relancer avec « sudo systemctl restart gagarine ».
# Toutes les clés sont facultatives ; la valeur écrite en commentaire est celle par défaut.
# Une valeur invalide est ignorée (avertissement dans le journal du service) et la valeur par défaut est gardée.

[gagarine]

# Pourcentage de RAM utilisée à partir duquel Gagarine fige le programme qui grossit le plus vite.
# La RAM « utilisée » est 100 % moins la mémoire disponible (le cache récupérable compte comme libre).
#seuil=95

# Pourcentage de RAM à partir duquel Gagarine arrête un programme tout de suite, sans attendre le rangement dans le swap.
#urgence=98

# Pourcentage de RAM à partir duquel Gagarine mesure quatre fois par seconde au lieu d'une.
#vigilance=85

# Secondes laissées après la pause d'un programme, avant de l'arrêter si la RAM n'est pas redescendue sous le seuil.
#grace=10

# Secondes au plus, tant que le rangement du programme figé dans le swap n'est pas fini (la grâce dure alors jusque-là).
#vidage_max=60

# Secondes au bout desquelles un programme figé sans décision (ni « reprendre » ni « arrêter ») est arrêté. 600 = 10 min.
#delai_fige=600

# Mo qu'un programme figé puis repris peut encore demander avant d'être arrêté par le noyau (plafond de son scope).
#reste_si_repris=256

# Notifications du bureau avec les boutons « Arrêter » et « Reprendre » : oui ou non.
#notifications=oui

# Noms de programmes à ne jamais figer ni arrêter, en plus de la liste intégrée (systemd, gnome-shell, sshd, dbus,
# NetworkManager, dockerd…). Expression régulière sur le nom du processus tel que le voit « ps -o comm » (15 caractères
# au plus), qui doit correspondre au nom entier. Exemple : postgres|mysqld|redis-server
#proteges=

# ---- Depuis la 1.2.0 ----------------------------------------------------------------------------------------------

# Anticipation, en secondes : au-delà de « vigilance », Gagarine fige dès maintenant le programme qui grossit si, à son
# rythme des 10 dernières secondes, il remplirait la RAM jusqu'au seuil dans ce délai. 0 : attendre le seuil.
#anticipation=15

# Pression mémoire, en % : au-delà de « vigilance », Gagarine agit aussi quand le noyau passe plus de ce pourcentage de
# son temps bloqué faute de mémoire (« full avg10 » de /proc/pressure/memory), même si le pourcentage de RAM reste bas.
# 0 : ne pas regarder la pression.
#pression=20

# Notification quand un travail de la file d'attente se termine (terminé, échoué, arrêté par sa limite) : oui ou non,
# seulement pour les travaux d'au moins « notification_fin_min » secondes (0 : tous).
#notifications_fin=oui
#notification_fin_min=30

# Alertes aussi sur le téléphone, par ntfy (application ntfy, https://ntfy.sh) : un sujet à soi, difficile à deviner
# (ex. gagarine-k7f3q9x2), ou l'adresse complète d'un sujet sur un autre serveur (https://ntfy.exemple.fr/gagarine).
# Vide : pas d'envoi. Les messages contiennent le nom des programmes et des travaux.
#ntfy=

# La file d'attente retient la mémoire réellement prise par chaque travail ; si un travail annonce bien moins que ce
# qu'il a déjà pris, elle corrige l'annonce d'elle-même (oui) ou se contente de prévenir (non).
#file_ajuster=oui

# Ménage : les démons et modèles qui gardent de la mémoire sans rien faire (démons Gradle et Kotlin, modèles LM Studio
# et Ollama) sont arrêtés ou déchargés tout seuls après « menage_delai » minutes d'inactivité (oui), ou seulement
# proposés dans l'interface et l'indicateur (non). Les serveurs de développement ne sont jamais arrêtés tout seuls.
#menage_auto=oui
#menage_delai=30

# Le hook des sessions Claude Code refuse les travaux lourds (tests, compilations, ffmpeg…) lancés hors de la file
# d'attente et donne la commande à utiliser (oui), ou se contente de le rappeler (non).
#claude_bloquer=oui

# ---- Depuis la 1.3.0 ----------------------------------------------------------------------------------------------

# Nombre de travaux de la file d'attente qui peuvent tourner en même temps, quand la mémoire (annonce ou mémoire apprise)
# et les cœurs suffisent pour tous. 1 : un seul à la fois, comme avant la 1.3.0.
#file_paralleles=2

# Fuites de mémoire : un programme qui grossit d'au moins ce nombre de Mo par minute, régulièrement, depuis 5 minutes,
# est signalé (journal, notification si fuite_notifier=oui, et ntfy si réglé). 0 : ne pas chercher les fuites.
#fuite_seuil=100
#fuite_notifier=oui

