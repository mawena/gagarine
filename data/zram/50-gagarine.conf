# Gagarine : swap compressé en RAM (zram), utilisé avant le swap disque.
# zram-size est la quantité de pages qu'il peut recevoir (en Mo) : celle de la RAM. Compressées en zstd, elles prennent
# 3 à 4 fois moins de place : un zram plein occupe environ un quart à un tiers de la RAM.
# Pour changer ces valeurs, mettre un fichier dans /etc/systemd/zram-generator.conf.d/ (voir zram-generator.conf(5)).
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
