# Gagarine : réglages du noyau pour un swap compressé en RAM (zram), ceux de Pop!_OS (repris par le wiki d'Arch Linux).
# Pour en changer un, le redéfinir dans /etc/sysctl.d/ (un fichier du même nom remplace celui-ci).
#
# Le zram est presque aussi rapide que la RAM : ranger les pages inutilisées y coûte moins que vider le cache disque.
vm.swappiness = 180
# Le noyau libère la mémoire un peu plus tôt, en tâche de fond, plutôt que de bloquer un programme quand elle manque
vm.watermark_scale_factor = 125
# Pas de rafales de récupération après une fragmentation de la mémoire (elles poussent au swap pour rien)
vm.watermark_boost_factor = 0
# Lecture du swap page par page : la lecture anticipée ne sert qu'aux disques
vm.page-cluster = 0
