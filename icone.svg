<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône de Gagarine : une fusée qui s'élève d'une jauge de mémoire. Dessin original (mawena), licence MIT. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a8c"/>
      <stop offset="1" stop-color="#1b2150"/>
    </linearGradient>
    <linearGradient id="corps" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe3ea"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c0cc"/>
    </linearGradient>
    <linearGradient id="flamme" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="0.6" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#e2381f"/>
    </linearGradient>
    <linearGradient id="jauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e389"/>
      <stop offset="0.6" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <clipPath id="piste"><rect x="18" y="102" width="92" height="11" rx="5.5"/></clipPath>
  </defs>
  <!-- fond arrondi -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fond)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <!-- étoiles -->
  <g fill="#ffffff" fill-opacity="0.8">
    <circle cx="24" cy="26" r="1.6"/><circle cx="104" cy="34" r="1.3"/><circle cx="96" cy="16" r="1"/>
    <circle cx="30" cy="62" r="1.1"/><circle cx="102" cy="70" r="1.5"/><circle cx="16" cy="44" r="0.9"/>
  </g>
  <!-- flamme -->
  <path d="M55 80 C55 94 64 100 64 100 C64 100 73 94 73 80 Z" fill="url(#flamme)"/>
  <path d="M59.5 80 C59.5 89 64 94 64 94 C64 94 68.5 89 68.5 80 Z" fill="#fff3b0"/>
  <!-- ailerons -->
  <path d="M49 56 L35 76 L35 86 L51 76 Z" fill="#e5383b"/>
  <path d="M79 56 L93 76 L93 86 L77 76 Z" fill="#e5383b"/>
  <!-- corps -->
  <path d="M64 12 C78 24 82 42 80 76 L48 76 C46 42 50 24 64 12 Z" fill="url(#corps)"/>
  <path d="M64 12 C70 17 74 22 76.500 28 L51.500 28 C54 22 58 17 64 12 Z" fill="#e5383b"/>
  <rect x="49" y="70" width="30" height="10" rx="2.500" fill="#8d95a6"/>
  <!-- hublot -->
  <circle cx="64" cy="48" r="9.500" fill="#9aa5bd"/>
  <circle cx="64" cy="48" r="7" fill="#1c71d8"/>
  <path d="M59.500 46 A5 5 0 0 1 65 43" fill="none" stroke="#99c1f1" stroke-width="2" stroke-linecap="round"/>
  <!-- jauge de mémoire -->
  <rect x="18" y="102" width="92" height="11" rx="5.500" fill="#ffffff" fill-opacity="0.18"/>
  <g clip-path="url(#piste)">
    <rect x="18" y="102" width="68" height="11" fill="url(#jauge)"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5">
    <path d="M96.500 99 V116"/><path d="M104 99 V116"/>
  </g>
</svg>
